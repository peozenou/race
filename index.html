<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>THE RACE</title>
  <meta name="description" content="Ligue de fantasy tennis entre amis : classements, duels entre équipes et statistiques des joueurs, saison par saison.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="THE RACE">
  <meta property="og:description" content="Ligue de fantasy tennis entre amis : classements, duels et statistiques, saison par saison.">
  <meta property="og:url" content="https://peozenou.github.io/race/">
  <meta property="og:image" content="https://peozenou.github.io/race/2026/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23c8d94a'/%3E%3Cpath d='M10 22c14 6 30 6 44 0M10 42c14-6 30-6 44 0' stroke='%23fff' stroke-width='4' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
  <style>
    :root {
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --serif: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
      --bg: #f9f9f7; --panel: #ffffff; --fg: #0b0b0b; --muted: #6d6b67; --line: rgba(11, 11, 11, 0.10);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0b0b; --panel: #1a1a19; --fg: #f0efec; --muted: #9a988f; --line: rgba(255, 255, 255, 0.10); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.45; }
    main { max-width: 44rem; margin: 0 auto; padding: 3rem 1.5rem; }
    h1 { font-family: var(--serif); font-weight: 400; font-size: 2.25rem; margin: 0 0 0.25rem; letter-spacing: 0.01em; }
    .lede { color: var(--muted); margin: 0 0 2rem; }
    h2 { font-size: 0.8125rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 2rem 0 0.75rem; }
    .season { display: flex; justify-content: space-between; align-items: center; gap: 1rem; text-decoration: none; color: inherit;
      background: var(--panel); border: 1px solid var(--line); border-radius: 0.5rem; padding: 1.1rem 1.25rem; }
    .season:hover, .season:focus-visible { border-color: var(--fg); outline: none; }
    .season-year { font-family: var(--serif); font-size: 1.5rem; line-height: 1.1; }
    .season-tag { font-size: 0.75rem; color: var(--muted); margin-left: 0.5rem; font-family: var(--sans); }
    .season-sub { font-size: 0.875rem; color: var(--muted); margin-top: 0.25rem; }
    .arrow { font-size: 1.25rem; color: var(--muted); }
    .soon { color: var(--muted); font-size: 0.875rem; margin: 0; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: 0.75rem; color: var(--muted); }
    @media (max-width: 640px) { main { padding: 2rem 1rem; } h1 { font-size: 1.875rem; } }
  </style>
</head>
<body>
<main>
  <h1>THE RACE</h1>
  <p class="lede">Ligue de fantasy tennis entre amis : classements, duels entre équipes et statistiques des joueurs, saison par saison.</p>

  <h2>Saison en cours</h2>
  <a class="season" href="2026/">
    <div>
      <div class="season-year">2026<span class="season-tag">en cours</span></div>
      <div class="season-sub" id="s2026">Classement, duels et joueurs, mis à jour chaque lundi.</div>
    </div>
    <span class="arrow" aria-hidden="true">→</span>
  </a>

  <h2>Saisons précédentes</h2>
  <p class="soon">À venir.</p>

  <footer>Données Tennis Abstract et Tennis Explorer.</footer>
</main>
<script>
  // Show the current leader of the 2026 season under its card.
  fetch('2026/data/hebdo.json', { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
    .then((rows) => {
      const last = Math.max(...rows.map((r) => r.week));
      const top = rows.filter((r) => r.week === last).sort((a, b) => b.total - a.total)[0];
      if (!top) return;
      const n = new Intl.NumberFormat('fr-FR').format(top.total);
      const d = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', timeZone: 'UTC' }).format(new Date(top.date + 'T00:00:00Z'));
      document.getElementById('s2026').textContent = `Semaine ${last} (${d}) : ${top.team} en tête avec ${n} points.`;
    })
    .catch(() => {});
</script>
</body>
</html>
